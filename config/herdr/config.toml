onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+f"
goto = "prefix+s"
settings = "prefix+."
split_vertical = "prefix+|"
detach = "prefix+d"

[ui]
sidebar_width = 20
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
tab_bar_position = "bottom"
tab_bar_right = [{ type = "command", command = "~/.config/herdr/scripts/herdr-active-workspace-label.sh" }]
